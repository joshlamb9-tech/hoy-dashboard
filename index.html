<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HoY Command Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       THEMES — 5 cockpit modes
       ═══════════════════════════════════════════════════════════════ */

    /* Night Vision — default */
    :root {
      --bg:           #030806;
      --bg2:          #051008;
      --card:         #071209;
      --card-hover:   #0a1a0d;
      --border:       #0d2212;
      --text:         #8aba8e;
      --text-strong:  #c8f0ca;
      --muted:        #3d6640;
      --accent:       #00ff41;
      --accent-glow:  rgba(0,255,65,0.3);
      --accent-soft:  rgba(0,255,65,0.06);
      --scan-opacity: 0.03;
      --p1:           #f04444;
      --p1-glow:      rgba(240,68,68,0.4);
      --p2:           #f59e0b;
      --p3:           #00ff41;
      --p4:           #3d6640;
      --success:      #34d399;
      --danger:       #f04444;
      --warning:      #f59e0b;
      --cat-parent:   #a78bfa;
      --cat-staff:    #38bdf8;
      --cat-slt:      #f59e0b;
    }

    /* Arctic */
    [data-theme="arctic"] {
      --bg:           #f2f2ed;
      --bg2:          #e8e8e3;
      --card:         #ffffff;
      --card-hover:   #fafaf8;
      --border:       #d0d0c8;
      --text:         #2a2a28;
      --text-strong:  #0a0a08;
      --muted:        #888880;
      --accent:       #1a1a1a;
      --accent-glow:  rgba(0,0,0,0.1);
      --accent-soft:  rgba(0,0,0,0.04);
      --scan-opacity: 0.01;
    }

    /* Infrared */
    [data-theme="infrared"] {
      --bg:           #0a0404;
      --bg2:          #120606;
      --card:         #1a0808;
      --card-hover:   #220a0a;
      --border:       #2d1010;
      --text:         #c49080;
      --text-strong:  #ffc8b0;
      --muted:        #6b4035;
      --accent:       #ff6b2b;
      --accent-glow:  rgba(255,107,43,0.3);
      --accent-soft:  rgba(255,107,43,0.06);
      --scan-opacity: 0.025;
    }

    /* Blue Glass */
    [data-theme="blueglass"] {
      --bg:           #030810;
      --bg2:          #050d18;
      --card:         #081220;
      --card-hover:   #0c1828;
      --border:       #102040;
      --text:         #80b0d0;
      --text-strong:  #c0e0ff;
      --muted:        #3a5570;
      --accent:       #00d4ff;
      --accent-glow:  rgba(0,212,255,0.3);
      --accent-soft:  rgba(0,212,255,0.06);
      --scan-opacity: 0.02;
    }

    /* Stealth */
    [data-theme="stealth"] {
      --bg:           #0a0a0a;
      --bg2:          #0e0e0e;
      --card:         #141414;
      --card-hover:   #1a1a1a;
      --border:       #222222;
      --text:         #777777;
      --text-strong:  #aaaaaa;
      --muted:        #444444;
      --accent:       #888888;
      --accent-glow:  rgba(136,136,136,0.15);
      --accent-soft:  rgba(136,136,136,0.04);
      --scan-opacity: 0.015;
    }

    /* ═══════════════════════════════════════════════════════════════
       RESET & BASE
       ═══════════════════════════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* CRT scan-line overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 1px,
        rgba(0,0,0,var(--scan-opacity)) 1px,
        rgba(0,0,0,var(--scan-opacity)) 2px
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       LAYOUT SHELL
       ═══════════════════════════════════════════════════════════════ */
    .dashboard {
      display: grid;
      grid-template-rows: 38px 1fr;
      height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════════════
       HEADER — cockpit top bar
       ═══════════════════════════════════════════════════════════════ */
    .header {
      height: 38px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
    }

    .header-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
      text-transform: uppercase;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Header stats */
    .summary-inline {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .stat-inline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .stat-inline .num {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
      line-height: 1;
    }

    .stat-inline .label {
      font-size: 7px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* Live clock */
    .header-clock {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* Sync badge */
    .sync-badge {
      font-size: 9px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
      letter-spacing: 0.04em;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .sync-badge.fresh .sync-dot {
      background: var(--success);
      box-shadow: 0 0 6px rgba(52,211,153,0.6);
    }

    .sync-badge.pulsing .sync-dot {
      animation: syncPulse 1s ease-in-out infinite;
    }

    @keyframes syncPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Theme selector — 5 small squares */
    .theme-switcher {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .theme-btn {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      flex-shrink: 0;
      outline: none;
    }

    .theme-btn:hover { transform: scale(1.3); }

    .theme-btn.active {
      border-color: var(--text-strong);
      box-shadow: 0 0 4px var(--accent-glow);
    }

    .theme-btn[data-t="nightvision"] { background: #00ff41; }
    .theme-btn[data-t="arctic"]      { background: #1a1a1a; }
    .theme-btn[data-t="infrared"]    { background: #ff6b2b; }
    .theme-btn[data-t="blueglass"]   { background: #00d4ff; }
    .theme-btn[data-t="stealth"]     { background: #888888; }

    /* ═══════════════════════════════════════════════════════════════
       GRID
       ═══════════════════════════════════════════════════════════════ */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    /* ─── Briefing Panel ─── */
    .briefing {
      grid-column: 1 / -1;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      display: flex;
      align-items: stretch;
      max-height: 28vh;
      overflow: hidden;
      box-shadow: 0 -1px 20px var(--accent-soft);
      position: relative;
    }

    /* accent top line */
    .briefing::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
    }

    .briefing-header {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 110px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      border-left: 4px solid var(--accent);
    }

    .briefing-title {
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent-glow);
      margin-bottom: 4px;
    }

    .briefing-date {
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .briefing-body {
      flex: 1;
      padding: 10px 18px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }

    .briefing-body:hover {
      scrollbar-color: var(--border) transparent;
    }

    .briefing-body::-webkit-scrollbar { width: 2px; }
    .briefing-body::-webkit-scrollbar-track { background: transparent; }
    .briefing-body::-webkit-scrollbar-thumb { background: transparent; border-radius: 2px; }
    .briefing-body:hover::-webkit-scrollbar-thumb { background: var(--border); }

    .briefing-text {
      font-size: 11.5px;
      font-weight: 400;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-line;
    }

    .briefing-flags {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      justify-content: center;
      min-width: 190px;
      max-width: 250px;
      border-left: 1px solid var(--border);
      flex-shrink: 0;
    }

    .briefing-flag {
      font-size: 9px;
      font-weight: 500;
      color: var(--warning);
      padding: 3px 8px;
      border-left: 3px solid var(--warning);
      background: rgba(245,158,11,0.06);
      letter-spacing: 0.02em;
    }

    .briefing-flag.critical {
      color: var(--danger);
      border-left-color: var(--danger);
      background: rgba(240,68,68,0.06);
    }

    .briefing-empty {
      font-size: 11px;
      color: var(--muted);
      font-style: italic;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      letter-spacing: 0.02em;
    }

    /* ─── Panels ─── */
    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
      animation: panelIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .panel:last-child { border-right: none; }
    .panel:nth-child(1) { animation-delay: 0.00s; }
    .panel:nth-child(2) { animation-delay: 0.06s; }
    .panel:nth-child(3) { animation-delay: 0.12s; }
    .panel:nth-child(4) { animation-delay: 0.18s; }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: var(--bg2);
      position: relative;
    }

    /* HUD bracket corners */
    .panel-header::before,
    .panel-header::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      pointer-events: none;
    }

    .panel-header::before {
      top: 3px;
      left: 3px;
      border-top: 1px solid var(--accent);
      border-left: 1px solid var(--accent);
    }

    .panel-header::after {
      bottom: 3px;
      right: 3px;
      border-bottom: 1px solid var(--accent);
      border-right: 1px solid var(--accent);
    }

    .panel-title {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent-glow);
    }

    .panel-count {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 7px;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color 0.2s;
    }

    .panel-body:hover {
      scrollbar-color: var(--accent) transparent;
    }

    .panel-body::-webkit-scrollbar { width: 2px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: transparent; border-radius: 0; }
    .panel-body:hover::-webkit-scrollbar-thumb { background: var(--accent); }

    /* ═══════════════════════════════════════════════════════════════
       SCHEDULE CARDS
       ═══════════════════════════════════════════════════════════════ */
    .timeline-item {
      background: var(--card);
      border: 1px solid var(--border);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      padding: 8px 10px;
      margin-bottom: 5px;
      display: flex;
      gap: 9px;
      align-items: center;
      animation: cardIn 0.3s ease both;
      transition: background 0.15s;
    }

    .timeline-item:hover { background: var(--card-hover); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .timeline-time {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
      min-width: 36px;
      line-height: 1;
      flex-shrink: 0;
    }

    .timeline-content { flex: 1; min-width: 0; }

    .timeline-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .timeline-meta {
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.03em;
      margin-top: 2px;
    }

    .timeline-type {
      font-size: 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 2px 6px;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
      flex-shrink: 0;
      clip-path: polygon(0 0, calc(100% - 3px) 0, 100% 3px, 100% 100%, 3px 100%, 0 calc(100% - 3px));
    }

    /* Current event */
    .timeline-item.now {
      border-color: var(--accent);
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 12px var(--accent-glow);
      animation: cardIn 0.3s ease both, nowPulse 2.5s ease-in-out infinite;
    }

    @keyframes nowPulse {
      0%, 100% { border-left-color: var(--accent); }
      50%       { border-left-color: transparent; }
    }

    /* Past — heavily muted */
    .timeline-item.past { opacity: 0.25; }

    /* ═══════════════════════════════════════════════════════════════
       TASK CARDS
       ═══════════════════════════════════════════════════════════════ */
    .task {
      background: var(--card);
      border: 1px solid var(--border);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      padding: 8px 10px;
      margin-bottom: 5px;
      display: flex;
      gap: 9px;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s, opacity 0.35s;
      animation: cardIn 0.3s ease both;
    }

    .task:hover { background: var(--card-hover); }

    /* Priority bar — 3px left strip */
    .task-priority {
      width: 3px;
      min-height: 22px;
      flex-shrink: 0;
      align-self: stretch;
      border-radius: 1px;
    }

    .task-priority.p1 {
      background: var(--p1);
      box-shadow: 0 0 6px var(--p1-glow);
      animation: p1pulse 1.8s ease-in-out infinite;
    }

    @keyframes p1pulse {
      0%, 100% { box-shadow: 0 0 4px var(--p1-glow); }
      50%       { box-shadow: 0 0 10px var(--p1-glow); }
    }

    .task-priority.p2 { background: var(--p2); }
    .task-priority.p3 { background: var(--accent); }
    .task-priority.p4 { background: var(--muted); opacity: 0.6; }

    .task-content { flex: 1; min-width: 0; }

    .task-title {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .task-meta {
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    /* Check — angular, border only; fills on hover */
    .task-check {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: transparent;
      transition: all 0.15s ease;
    }

    .task:hover .task-check {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .task.done {
      transform: scale(0.95);
      opacity: 0;
      pointer-events: none;
    }

    .task.done .task-title { text-decoration: line-through; }

    .task.done .task-check {
      background: var(--success);
      border-color: var(--success);
      color: #000;
    }

    /* ═══════════════════════════════════════════════════════════════
       EMAIL CARDS
       ═══════════════════════════════════════════════════════════════ */
    .email {
      background: var(--card);
      border: 1px solid var(--border);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      padding: 9px 10px;
      margin-bottom: 5px;
      transition: background 0.15s, opacity 0.3s, transform 0.3s;
      animation: cardIn 0.3s ease both;
    }

    .email:hover { background: var(--card-hover); }

    .email.dismissed {
      transform: translateX(-18px);
      opacity: 0;
      pointer-events: none;
      margin-bottom: 0;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
    }

    .email-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
      gap: 7px;
    }

    .email-sender {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .email-header-right {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    /* Category badge — outlined, transparent bg */
    .email-badge {
      font-size: 7px;
      font-weight: 700;
      padding: 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: 1px solid currentColor;
      background: transparent;
    }

    .email-badge.parent   { color: var(--cat-parent); }
    .email-badge.staff    { color: var(--cat-staff); }
    .email-badge.slt      { color: var(--cat-slt); }
    .email-badge.system   { color: var(--muted); }
    .email-badge.external { color: var(--muted); }

    /* Dismiss X — square, hidden until hover */
    .email-dismiss {
      width: 15px;
      height: 15px;
      border-radius: 2px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: all 0.12s ease;
      flex-shrink: 0;
      opacity: 0;
    }

    .email:hover .email-dismiss { opacity: 1; }

    .email-dismiss:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .email-subject {
      font-size: 10px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .email-snippet {
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .email-action {
      margin-top: 4px;
      font-size: 9px;
      font-weight: 600;
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent-glow);
      letter-spacing: 0.03em;
    }

    .email-pupils {
      margin-top: 5px;
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .pupil-tag {
      font-size: 8px;
      font-weight: 500;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 2px 6px 2px 5px;
      letter-spacing: 0.04em;
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
    }

    /* ═══════════════════════════════════════════════════════════════
       TREND CARDS
       ═══════════════════════════════════════════════════════════════ */
    .trend {
      background: var(--card);
      border: 1px solid var(--border);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
      padding: 9px 10px;
      margin-bottom: 5px;
      transition: background 0.15s;
      animation: cardIn 0.3s ease both;
    }

    .trend:hover { background: var(--card-hover); }

    .trend-header {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 3px;
    }

    .trend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .trend-dot.info {
      background: var(--accent);
      box-shadow: 0 0 5px var(--accent-glow);
    }

    .trend-dot.watch {
      background: var(--warning);
      box-shadow: 0 0 6px rgba(245,158,11,0.5);
    }

    .trend-dot.action {
      background: var(--danger);
      box-shadow: 0 0 6px rgba(240,68,68,0.5);
      animation: beacon 2s ease-in-out infinite;
    }

    @keyframes beacon {
      0%, 100% { box-shadow: 0 0 4px rgba(240,68,68,0.3); }
      50%       { box-shadow: 0 0 12px rgba(240,68,68,0.8); }
    }

    .trend-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-strong);
    }

    .trend-detail {
      font-size: 9px;
      font-weight: 400;
      color: var(--muted);
      margin-left: 14px;
      line-height: 1.6;
    }

    .trend-pupils {
      margin-top: 5px;
      margin-left: 14px;
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    /* ═══════════════════════════════════════════════════════════════
       EMPTY / LOADING
       ═══════════════════════════════════════════════════════════════ */
    .empty {
      padding: 24px 12px;
      color: var(--muted);
      font-size: 9px;
      text-align: center;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .loading {
      padding: 30px 12px;
      color: var(--muted);
      font-size: 9px;
      text-align: center;
      letter-spacing: 0.06em;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 1px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 2px;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="dashboard">

    <div class="header">
      <div class="header-left">
        <div class="header-title">HOY COMMAND CENTRE</div>
      </div>
      <div class="header-right">
        <div class="summary-inline">
          <div class="stat-inline">
            <div class="num" id="statTasks">&ndash;</div>
            <div class="label">tasks</div>
          </div>
          <div class="stat-inline">
            <div class="num" id="statEmails">&ndash;</div>
            <div class="label">inbox</div>
          </div>
          <div class="stat-inline">
            <div class="num" id="statEvents">&ndash;</div>
            <div class="label">events</div>
          </div>
          <div class="stat-inline">
            <div class="num" id="statTrends">&ndash;</div>
            <div class="label">trends</div>
          </div>
        </div>
        <div class="sync-badge" id="syncBadge">
          <span class="sync-dot"></span>
          <span id="syncText">loading&hellip;</span>
        </div>
        <div class="header-clock" id="currentDate"></div>
        <div class="theme-switcher" id="themeSwitcher">
          <button class="theme-btn" data-t="nightvision" title="Night Vision"></button>
          <button class="theme-btn" data-t="arctic"      title="Arctic"></button>
          <button class="theme-btn" data-t="infrared"    title="Infrared"></button>
          <button class="theme-btn" data-t="blueglass"   title="Blue Glass"></button>
          <button class="theme-btn" data-t="stealth"     title="Stealth"></button>
        </div>
      </div>
    </div>

    <div class="grid">

      <!-- Briefing — full width strip -->
      <div class="briefing" id="briefingPanel">
        <div class="briefing-header">
          <div class="briefing-title">BRIEFING ///</div>
          <div class="briefing-date" id="briefingDate"></div>
        </div>
        <div class="briefing-body" id="briefingBody">
          <div class="briefing-empty">No briefing yet</div>
        </div>
        <div class="briefing-flags" id="briefingFlags"></div>
      </div>

      <!-- Schedule -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Schedule</div>
          <div class="panel-count" id="eventCount"></div>
        </div>
        <div class="panel-body" id="timelineList">
          <div class="loading"><div class="spinner"></div>Loading&hellip;</div>
        </div>
      </div>

      <!-- Tasks -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Tasks</div>
          <div class="panel-count" id="taskCount"></div>
        </div>
        <div class="panel-body" id="taskList">
          <div class="loading"><div class="spinner"></div>Loading&hellip;</div>
        </div>
      </div>

      <!-- Inbox -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Inbox</div>
          <div class="panel-count" id="emailCount"></div>
        </div>
        <div class="panel-body" id="emailList">
          <div class="loading"><div class="spinner"></div>Loading&hellip;</div>
        </div>
      </div>

      <!-- Trends -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Trends</div>
          <div class="panel-count" id="trendCount"></div>
        </div>
        <div class="panel-body" id="trendList">
          <div class="loading"><div class="spinner"></div>Loading&hellip;</div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    /* ═══ Supabase ═══ */
    const SUPABASE_URL  = 'https://dlcseuejvducbsjhqvze.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsY3NldWVqdmR1Y2JzamhxdnplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1MzY3NTUsImV4cCI6MjA4ODExMjc1NX0.MPkeXx_3cgm99RabE4W97jhFtB1ZXycUsR0ofCnNEPs';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    /* ═══ Theme ═══ */
    const THEMES = ['nightvision', 'arctic', 'infrared', 'blueglass', 'stealth'];
    function applyTheme(name) {
      const t = THEMES.includes(name) ? name : 'nightvision';
      if (t === 'nightvision') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
      localStorage.setItem('hoy-theme', t);
    }
    document.getElementById('themeSwitcher').addEventListener('click', e => {
      const b = e.target.closest('.theme-btn');
      if (b) applyTheme(b.dataset.t);
    });
    applyTheme(localStorage.getItem('hoy-theme') || 'nightvision');

    /* ═══ Date ═══ */
    const now = new Date();
    const D = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('currentDate').textContent =
      `${D[now.getDay()]} ${now.getDate()} ${M[now.getMonth()]} ${now.getFullYear()}`;

    /* ═══ Helpers ═══ */
    function fmt(ts) { return new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); }
    function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function empty(m) { return `<div class="empty">${m}</div>`; }

    /* ═══ Render: Briefing ═══ */
    function renderBriefing(briefing) {
      const dateEl = document.getElementById('briefingDate');
      const bodyEl = document.getElementById('briefingBody');
      const flagsEl = document.getElementById('briefingFlags');
      if (!briefing) {
        dateEl.textContent = '';
        bodyEl.innerHTML = '<div class="briefing-empty">No briefing yet</div>';
        flagsEl.innerHTML = '';
        return;
      }
      dateEl.textContent = briefing.briefing_date;
      bodyEl.innerHTML = `<div class="briefing-text">${esc(briefing.summary)}</div>`;
      if (briefing.trend_flags?.length) {
        flagsEl.innerHTML = briefing.trend_flags.map(f => `<div class="briefing-flag">${esc(f)}</div>`).join('');
      } else {
        flagsEl.innerHTML = '';
      }
    }

    /* ═══ Render: Schedule ═══ */
    function renderSchedule(events) {
      document.getElementById('eventCount').textContent = events.length;
      document.getElementById('statEvents').textContent = events.length;
      const el = document.getElementById('timelineList');
      if (!events.length) { el.innerHTML = empty('Nothing scheduled today'); return; }
      const ms = Date.now();
      el.innerHTML = events.map((e, i) => {
        const s = new Date(e.start_time).getTime(), en = new Date(e.end_time).getTime();
        const cls = ms >= s && ms <= en ? ' now' : ms > en ? ' past' : '';
        const typ = e.event_type ? `<span class="timeline-type">${esc(e.event_type)}</span>` : '';
        return `<div class="timeline-item${cls}" style="animation-delay:${i * 0.03}s">
          <div class="timeline-time">${fmt(e.start_time)}</div>
          <div class="timeline-content">
            <div class="timeline-title">${esc(e.title)}</div>
            <div class="timeline-meta">${fmt(e.start_time)}&ndash;${fmt(e.end_time)}</div>
          </div>${typ}</div>`;
      }).join('');
    }

    /* ═══ Render: Tasks ═══ */
    function renderTasks(tasks) {
      document.getElementById('statTasks').textContent = tasks.length;
      document.getElementById('taskCount').textContent = tasks.length;
      const el = document.getElementById('taskList');
      if (!tasks.length) { el.innerHTML = empty('All clear'); return; }
      el.innerHTML = tasks.map((t, i) => {
        const meta = [t.project || t.source, t.section, t.due_date].filter(Boolean).join(' \u00b7 ');
        return `<div class="task" data-task-id="${t.id}" style="animation-delay:${i * 0.03}s">
          <div class="task-priority ${t.priority||'p4'}"></div>
          <div class="task-content">
            <div class="task-title">${esc(t.title)}</div>
            <div class="task-meta">${esc(meta)}</div>
          </div>
          <div class="task-check">&#10003;</div></div>`;
      }).join('');
      el.querySelectorAll('.task').forEach(c => c.addEventListener('click', () => completeTask(c)));
    }

    /* ═══ Render: Inbox ═══ */
    function renderEmails(emails) {
      document.getElementById('statEmails').textContent = emails.length;
      document.getElementById('emailCount').textContent = emails.length;
      const el = document.getElementById('emailList');
      if (!emails.length) { el.innerHTML = empty('No action needed'); return; }
      el.innerHTML = emails.map((e, i) => {
        const badge = e.category ? `<span class="email-badge ${esc(e.category)}">${esc(e.category)}</span>` : '';
        const pupils = e.pupil_names?.length ? `<div class="email-pupils">${e.pupil_names.map(p=>`<span class="pupil-tag">${esc(p)}</span>`).join('')}</div>` : '';
        const action = e.action_summary ? `<div class="email-action">${esc(e.action_summary)}</div>` : '';
        return `<div class="email" data-email-id="${e.id}" style="animation-delay:${i * 0.03}s">
          <div class="email-header">
            <div class="email-sender">${esc(e.sender_name||e.sender_email)}</div>
            <div class="email-header-right">${badge}<button class="email-dismiss" title="Dismiss">&#x2715;</button></div>
          </div>
          <div class="email-subject">${esc(e.subject)}</div>
          <div class="email-snippet">${esc(e.snippet||'')}</div>
          ${pupils}${action}</div>`;
      }).join('');
      el.querySelectorAll('.email-dismiss').forEach(b => {
        b.addEventListener('click', ev => { ev.stopPropagation(); dismissEmail(b.closest('.email')); });
      });
    }

    /* ═══ Render: Trends ═══ */
    function renderTrends(trends) {
      document.getElementById('statTrends').textContent = trends.length;
      document.getElementById('trendCount').textContent = trends.length;
      const el = document.getElementById('trendList');
      if (!trends.length) { el.innerHTML = empty('No trends detected'); return; }
      el.innerHTML = trends.map((t, i) => {
        const pupils = t.pupil_names?.length ? `<div class="trend-pupils">${t.pupil_names.map(p=>`<span class="pupil-tag">${esc(p)}</span>`).join('')}</div>` : '';
        return `<div class="trend" style="animation-delay:${i * 0.03}s">
          <div class="trend-header">
            <div class="trend-dot ${esc(t.severity)}"></div>
            <div class="trend-title">${esc(t.title)}</div>
          </div>
          <div class="trend-detail">${esc(t.detail||'')}</div>${pupils}</div>`;
      }).join('');
    }

    /* ═══ Render: Sync Badge ═══ */
    function renderSync(s) {
      const b = document.getElementById('syncBadge');
      const t = document.getElementById('syncText');
      b.classList.remove('pulsing');
      if (s) {
        const ago = Math.round((Date.now() - new Date(s.synced_at).getTime()) / 60000);
        t.textContent = ago < 60 ? `synced ${ago}m ago` : `synced ${Math.round(ago/60)}h ago`;
        b.classList.toggle('fresh', ago < 60);
      } else { t.textContent = 'not synced'; b.classList.remove('fresh'); }
    }

    /* ═══ Load ═══ */
    async function loadDashboard() {
      document.getElementById('syncBadge').classList.add('pulsing');
      const today = new Date().toISOString().split('T')[0];
      const [tasksR, emailsR, eventsR, trendsR, syncR, briefR] = await Promise.all([
        sb.from('daily_tasks').select('*').eq('status','pending').order('priority',{ascending:true}),
        sb.from('email_actions').select('*').eq('requires_action',true).order('received_at',{ascending:false}),
        sb.from('calendar_events').select('*').gte('start_time',`${today}T00:00:00`).lte('start_time',`${today}T23:59:59`).order('start_time',{ascending:true}),
        sb.from('trends').select('*').order('severity',{ascending:true}),
        sb.from('sync_log').select('*').order('synced_at',{ascending:false}).limit(1),
        sb.from('daily_briefing').select('*').order('briefing_date',{ascending:false}).limit(1)
      ]);
      renderBriefing(briefR.data?.[0]||null);
      renderSchedule(eventsR.data||[]);
      renderTasks(tasksR.data||[]);
      renderEmails(emailsR.data||[]);
      renderTrends(trendsR.data||[]);
      renderSync(syncR.data?.[0]||null);
    }

    /* ═══ Actions ═══ */
    async function completeTask(card) {
      card.classList.add('done');
      const { error } = await sb.from('daily_tasks').update({status:'done'}).eq('id', card.dataset.taskId);
      if (error) { card.classList.remove('done'); return; }
      setTimeout(() => { card.remove(); updateStat('task'); }, 350);
    }

    async function dismissEmail(card) {
      card.classList.add('dismissed');
      const { error } = await sb.from('email_actions').update({requires_action:false}).eq('id', card.dataset.emailId);
      if (error) { card.classList.remove('dismissed'); return; }
      setTimeout(() => { card.remove(); updateStat('email'); }, 300);
    }

    function updateStat(type) {
      if (type === 'task') {
        const n = document.querySelectorAll('#taskList .task:not(.done)').length;
        document.getElementById('statTasks').textContent = n;
        document.getElementById('taskCount').textContent = n;
        if (!n) document.getElementById('taskList').innerHTML = empty('All clear');
      } else {
        const n = document.querySelectorAll('#emailList .email:not(.dismissed)').length;
        document.getElementById('statEmails').textContent = n;
        document.getElementById('emailCount').textContent = n;
        if (!n) document.getElementById('emailList').innerHTML = empty('No action needed');
      }
    }

    /* ═══ Boot ═══ */
    loadDashboard();
    setInterval(loadDashboard, 30000);
  </script>
</body>
</html>
